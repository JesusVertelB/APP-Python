name: Enviar Resumen Diario

on:
  schedule:
    # Se ejecuta todos los días a las 12:00 UTC (07:00 AM hora de Colombia)
    - cron: '0 12 * * *'
  workflow_dispatch: # Activa un botón para que puedas probarlo manualmente en cualquier momento

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Ejecutar Clima.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python Clima.py